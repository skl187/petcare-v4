
// file: portal.fomain.com
server {
    server_name portal.bracepetcare.app www.portal.bracepetcare.app;

    # FRONTEND
    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ✅ API routed internally
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/portal.domain.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.domain.app/privkey.pem;
}

oldfile: portal
server {
    server_name portal.bracepetcare.app www.portal.bracepetcare.app;
    
    location / {
        proxy_pass http://localhost:3001;  # Your frontend dev server (adjust port if needed)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portal.bracepetcare.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal.bracepetcare.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

// file: api.domain.com
server {
    server_name api.domain.app www.api.domain.app;
    location / {
        proxy_pass http://localhost:3000;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.domain.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.domain.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.api.domain.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = api.domain.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.domain.app www.api.domain.app;
    return 404; # managed by Certbot
}


# if Docker nginx
events {}

http {

    upstream frontend {
        server frontend:5173;
    }

    upstream backend {
        server backend:3000;
    }

    server {
        listen 80;

        server_name portal.domain.app;

        location / {
            proxy_pass http://frontend;
        }

        location /api/ {
            proxy_pass http://backend;
        }
    }
}
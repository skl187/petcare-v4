version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-3001}:5173"  # Map 3001 (host) to 5173 (container)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend


  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-petcare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petcare.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    depends_on:
      - db

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: v4-backend-1
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
      - db_default

  frontend-1:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: v4-frontend-1
    env_file:
      - ./frontend/.env
    # ✅ THIS OVERRIDES .env VALUE
    environment:
      - VITE_API_URL=/api
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-3001}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # IMPORTANT for docker access
    command: npm run dev -- --host
    restart: unless-stopped
    networks:
      - db_default

networks:
  db_default:
    external: true

volumes:
  db_data: